name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # build.ts and the tests run TypeScript directly, which needs Node 22.6+
          node-version: 22
          cache: npm
      - run: npm ci
      - name: The panel page and its copy in src are in step
        run: |
          npm run gen:editor
          git diff --exit-code src/panelHtml.ts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: The core builds alone and runs in plain Node
        run: |
          npm run build:core
          node --input-type=module -e 'import { buildReport, TEMPLATES } from "./dist-core/e2e-core.js"; const r = buildReport(TEMPLATES[0].text); if (!r.scenarios.length) throw new Error("no scenarios"); console.log("core bundle ok:", r.scenarios.length, "scenarios")'
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: dist/*.drawdyx
